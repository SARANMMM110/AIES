# Native host nginx — HTTP bootstrap (single domain).
# Install: cp deploy/nginx/host.bootstrap.conf /etc/nginx/sites-available/aienterprisestudio
#          ln -sf /etc/nginx/sites-available/aienterprisestudio /etc/nginx/sites-enabled/
#          rm -f /etc/nginx/sites-enabled/default
#          nginx -t && systemctl reload nginx

upstream aes_web {
  server 127.0.0.1:3000;
  keepalive 32;
}

upstream aes_api {
  server 127.0.0.1:4000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name aienterprisestudio.com www.aienterprisestudio.com;

  client_max_body_size 12m;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /api/ {
    proxy_pass http://aes_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://aes_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
