services:
  postgres:
    image: postgres:16-alpine
    container_name: aes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ai_enterprise_studio}
    volumes:
      - aes_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aes} -d ${POSTGRES_DB:-ai_enterprise_studio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aes}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_enterprise_studio}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app/packages/database
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: aes-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-aes}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_enterprise_studio}?schema=public
    volumes:
      - aes_uploads:/app/apps/api/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.aienterprisestudio.com}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-AI Enterprise Studio}
    container_name: aes-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: aes-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/aienterprisestudio.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - web
      - api

  certbot:
    image: certbot/certbot:latest
    container_name: aes-certbot
    volumes:
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h; done"

volumes:
  aes_pg_data:
  aes_uploads:
